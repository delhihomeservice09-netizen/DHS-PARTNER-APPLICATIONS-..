name: DHS Partner Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP_FILE" -d build-src
          chmod -R u+rwX build-src

          echo "ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find build-src -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          UNSIGNED_APK=$(find "$APK_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          echo "APK before signing:"
          ls -lh "$UNSIGNED_APK"

          KEYSTORE="$RUNNER_TEMP/dhs-partner-release.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias dhspartner \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=DHS Partner, OU=DHS, O=Delhi Home Service, L=Delhi, ST=Delhi, C=IN"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          ALIGNED_APK="$APK_DIR/DHS-Partner-v8.20.8-aligned.apk"
          SIGNED_APK="$APK_DIR/DHS-Partner-v8.20.8-SIGNED.apk"

          "$ZIPALIGN" -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias dhspartner \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          rm -f "$UNSIGNED_APK"
          rm -f "$ALIGNED_APK"

          echo "SIGNED APK:"
          ls -lh "$SIGNED_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DHS-Partner-v8.20.8-SIGNED
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/DHS-Partner-v8.20.8-SIGNED.apk
          if-no-files-found: error
